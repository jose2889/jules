<div class="summary-container" *ngIf="summary">
  <div class="summary-card">
    <i class="fas fa-dollar-sign"></i>
    <div>
      <h4>Monto Total a Pagar</h4>
      <p>{{ summary.montoTotalAPagar | currencySpace:'CLP' }}</p>
    </div>
  </div>
  <div class="summary-card">
    <i class="fas fa-credit-card"></i>
    <div>
      <h4>Cupo Disponible Total</h4>
      <p>{{ summary.cupoDisponibleTotal | currencySpace:'CLP' }}</p>
    </div>
  </div>
  <div class="summary-card">
    <i class="fas fa-university"></i>
    <div>
      <h4>Cupo Total General</h4>
      <p>{{ summary.cupoTotalGeneral | currencySpace:'CLP' }}</p>
    </div>
  </div>
</div>
